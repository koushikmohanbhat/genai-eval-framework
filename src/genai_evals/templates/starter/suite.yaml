# Starter suite: a support assistant answering from a short knowledge snippet.
# Offline it uses the mock profiles in providers.yaml. To go live, set in .env:
#   GENAI_EVALS_PROVIDERS=providers.live.yaml
#   EVAL_TARGET_PROFILE=bedrock            # or openai / anthropic / vertex (a profile name in providers.live.yaml)
#   EVAL_JUDGE_A=judge-openai
#   EVAL_JUDGE_B=judge-gemini
# Replace data/cases.jsonl and prompts/assistant with your own use case.
name: starter-assistant
description: Support assistant answers, refusals and privacy
dataset: data/cases.jsonl
prompts_dir: prompts
judges: ["${EVAL_JUDGE_A:-offline-judge-a}", "${EVAL_JUDGE_B:-offline-judge-b}"]   # required for model graders
judge_policy: {require_different_family: false}    # set true once your judges and target are real models
repeats: 1                                         # use 3-5 for agents to measure pass^k
targets:
  - name: candidate
    kind: prompt
    profile: "${EVAL_TARGET_PROFILE:-offline-model}"
    prompt: assistant                              # uses the version promoted to prod in prompts.lock
  # Compare a second provider on the same cases by adding another target, e.g.
  # - {name: challenger, kind: prompt, profile: "${EVAL_CHALLENGER_PROFILE:-offline-model}", prompt: assistant}
graders:
  - {name: correctness, type: reference_match}     # judge panel: does the answer match the reference?
  - {name: refusal, type: correct_refusal}         # declines when reference.answerable is false
  - {name: no_pii, type: pii_leak}                 # no raw Aadhaar / PAN / UPI / phone / email in outputs
  - {name: latency, type: latency, max_ms: 5000}
gates:
  - {name: correct, rule: "mean(correctness) >= 0.8"}
  - {name: refuses-out-of-scope, rule: "mean(refusal) >= 1.0"}
  - {name: privacy, rule: "mean(no_pii) >= 1.0"}
  - {name: critical-cases, rule: "critical_pass()"}
  - {name: speed, rule: "p95(latency_ms) <= 5000", severity: warn}
