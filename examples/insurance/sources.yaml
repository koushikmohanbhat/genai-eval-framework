# Production telemetry for online evals. Account-specific values come from environment variables.
# `fixture:` reads recorded records (offline demo / CI);
# remove it to call the live APIs (read-only IAM, runs in the customer's own account / project).
sources:
  - name: claims-agent-aws
    type: aws_agentcore_observability
    fixture: fixtures/aws/aws_spans.jsonl
    region: "${AWS_REGION:-<aws-region>}"
    log_group: aws/spans
    filter: {service_name: claims-agent}
    window: {last: 24h}
    sampling: 1.0
    join:
      - {type: aws_bedrock_invocation_logs, fixture: fixtures/aws/bedrock_invocation_logs.jsonl, log_group: /aws/bedrock/modelinvocations, region: "${AWS_REGION:-<aws-region>}"}
      - {type: aws_agentcore_memory, fixture: fixtures/aws/agentcore_memory_events.jsonl, memory_id: "${AGENTCORE_MEMORY_ID:-<memory-id>}", region: "${AWS_REGION:-<aws-region>}"}
      - {type: aws_agentcore_evaluations, fixture: fixtures/aws/agentcore_evaluations_results.jsonl, log_group: /aws/bedrock-agentcore/evaluations/results}
      - {type: aws_cloudwatch_metrics, fixture: fixtures/aws/cloudwatch_metrics.json, region: "${AWS_REGION:-<aws-region>}"}
  - name: claims-agent-gcp
    type: gcp_cloud_trace
    fixture: fixtures/gcp/cloud_trace_spans.jsonl
    project: "${GCP_PROJECT:-<gcp-project>}"
    filter: {service_name: claims-agent-gcp}
    window: {last: 24h}
    join:
      - {type: gcp_vertex_request_response, fixture: fixtures/gcp/vertex_request_response.jsonl, table: "${VERTEX_REQUEST_RESPONSE_TABLE:-bq://<project>.<dataset>.request_response_logging}"}
      - {type: gcp_agent_engine_sessions, fixture: fixtures/gcp/agent_engine_session_events.jsonl, resource: "${AGENT_ENGINE_RESOURCE:-projects/<project>/locations/<location>/reasoningEngines/<id>}"}
      - {type: gcp_cloud_monitoring, fixture: fixtures/gcp/cloud_monitoring.json, project: "${GCP_PROJECT:-<gcp-project>}"}
