# Google-built OpenTelemetry Collector: receive OTLP, redact Indian identifiers, send traces to the Telemetry API
# (OTLP -> Cloud Trace) and metrics to Cloud Monitoring.
receivers:
  otlp:
    protocols: {grpc: {endpoint: 0.0.0.0:4317}, http: {endpoint: 0.0.0.0:4318}}
processors:
  batch: {}
  resourcedetection: {detectors: [gcp], timeout: 10s}
  transform/redact_pii:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_all_patterns(attributes, "value", "\\b[2-9]\\d{3}[ -]?\\d{4}[ -]?\\d{4}\\b", "<AADHAAR>")
          - replace_all_patterns(attributes, "value", "\\b[A-Z]{3}[ABCFGHLJPT][A-Z]\\d{4}[A-Z]\\b", "<PAN>")
          - replace_all_patterns(attributes, "value", "(\\+91[ -]?)?\\b[6-9]\\d{4}[ -]?\\d{5}\\b", "<PHONE_IN>")
          - replace_all_patterns(attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\\.[A-Za-z0-9-]+)+", "<EMAIL>")
extensions:
  googleclientauth: {}
exporters:
  otlphttp/telemetry:
    endpoint: https://telemetry.googleapis.com
    auth: {authenticator: googleclientauth}
  googlemanagedprometheus: {}
service:
  extensions: [googleclientauth]
  pipelines:
    traces: {receivers: [otlp], processors: [resourcedetection, transform/redact_pii, batch], exporters: [otlphttp/telemetry]}
    metrics: {receivers: [otlp], processors: [resourcedetection, batch], exporters: [googlemanagedprometheus]}
