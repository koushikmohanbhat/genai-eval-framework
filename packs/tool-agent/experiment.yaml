# Experiment: compare candidate changes with today's agent on the same conversations (docs: experiments.md).
#   genai-evals experiment run experiment.yaml --out out/experiment
# The variants use the simulator's options to show typical regressions; for your agent, vary prompt
# (support_agent@1.1.0), profile (another model) or target settings instead.
name: cheaper-model-and-prompt-trim
hypothesis: A faster model holds task success; a shorter prompt without the refund limit keeps behaviour the same.
suite: suite.yaml
baseline: {name: current, description: today's agent}
variants:
  - {name: fast-model, options: {model: fast}, description: "a cheaper, faster model"}
  - {name: prompt-without-limit, options: {refund_limit: 100000}, description: a shorter prompt that lost the refund-limit rule}
