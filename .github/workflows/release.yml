name: release
# Builds the wheel and sdist for a tag and attaches them (with an SBOM and build provenance) to the GitHub Release.
# Runs on a tag push, or by hand for an existing tag (Actions > release > Run workflow, tag: v0.6.2) to backfill
# the artifacts of a release made earlier. Works whether or not the release already exists.
on:
  push: {tags: ["v*"]}
  workflow_dispatch:
    inputs:
      tag: {description: "existing tag to build and attach artifacts to, e.g. v0.6.2", required: true}
permissions: {contents: write, id-token: write, attestations: write}
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {ref: "${{ inputs.tag || github.ref }}"}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install build cyclonedx-bom pip-audit
      - run: python -m build
      - name: check the built version matches the tag
        run: |
          ls dist/
          test -n "$(ls dist/*-"${TAG#v}"-*.whl)" || { echo "wheel version does not match $TAG"; exit 1; }
      - name: audit dependencies (the package itself is not on PyPI, so audit what it pulls in)
        run: |
          pip install dist/*.whl
          pip freeze --exclude genai-eval-framework > requirements.audit.txt
          pip-audit --strict --no-deps --disable-pip -r requirements.audit.txt
      - run: cyclonedx-py environment -o dist/sbom.cdx.json
      - uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with: {subject-path: "dist/*"}
      - name: attach to the release (create it if it doesn't exist yet)
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --generate-notes --verify-tag
          fi
