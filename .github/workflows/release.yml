name: release
on:
  push: {tags: ["v*"]}
permissions: {contents: write, id-token: write, attestations: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install build cyclonedx-bom pip-audit
      - run: python -m build
      - name: audit dependencies (the package itself is not on PyPI, so audit what it pulls in)
        run: |
          pip install dist/*.whl
          pip freeze --exclude genai-eval-framework > requirements.audit.txt
          pip-audit --strict --no-deps --disable-pip -r requirements.audit.txt
      - run: cyclonedx-py environment -o dist/sbom.cdx.json
      - uses: actions/attest-build-provenance@v1
        with: {subject-path: "dist/*"}
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env: {GH_TOKEN: "${{ github.token }}"}
