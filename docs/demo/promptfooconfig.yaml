# Generated by `genai-evals promptfoo export`.
# NOTE: fields (field_match) has no Promptfoo equivalent; it runs only in genai-evals
description: Exported from genai-evals suite 'claims-extraction-live'
prompts:
- id: openai
  label: claim_extractor@1.0.0
  raw: '[{"role": "system", "content": "Extract these fields from the customer''s
    message and return JSON only:\npolicy_number (MOT-YYYY-NNNNNN), claimant_name,
    incident_date (YYYY-MM-DD), claim_amount (number in rupees; \"1.2 lakh\" = 120000,
    \"45k\" = 45000),\nvehicle_reg (as written, e.g. \"KA 05 MN 4521\"), incident_type
    (one of collision, theft, fire, flood). Use null when a field is not present.\n"},
    {"role": "user", "content": "{{input}}"}]'
- id: bedrock-nova
  label: claim_extractor@1.0.0
  raw: '[{"role": "system", "content": "Extract these fields from the customer''s
    message and return JSON only:\npolicy_number (MOT-YYYY-NNNNNN), claimant_name,
    incident_date (YYYY-MM-DD), claim_amount (number in rupees; \"1.2 lakh\" = 120000,
    \"45k\" = 45000),\nvehicle_reg (as written, e.g. \"KA 05 MN 4521\"), incident_type
    (one of collision, theft, fire, flood). Use null when a field is not present.\n"},
    {"role": "user", "content": "{{input}}"}]'
- id: vertex-gemini
  label: claim_extractor@1.0.0
  raw: '[{"role": "system", "content": "Extract these fields from the customer''s
    message and return JSON only:\npolicy_number (MOT-YYYY-NNNNNN), claimant_name,
    incident_date (YYYY-MM-DD), claim_amount (number in rupees; \"1.2 lakh\" = 120000,
    \"45k\" = 45000),\nvehicle_reg (as written, e.g. \"KA 05 MN 4521\"), incident_type
    (one of collision, theft, fire, flood). Use null when a field is not present.\n"},
    {"role": "user", "content": "{{input}}"}]'
- id: claude
  label: claim_extractor@1.0.0
  raw: '[{"role": "system", "content": "Extract these fields from the customer''s
    message and return JSON only:\npolicy_number (MOT-YYYY-NNNNNN), claimant_name,
    incident_date (YYYY-MM-DD), claim_amount (number in rupees; \"1.2 lakh\" = 120000,
    \"45k\" = 45000),\nvehicle_reg (as written, e.g. \"KA 05 MN 4521\"), incident_type
    (one of collision, theft, fire, flood). Use null when a field is not present.\n"},
    {"role": "user", "content": "{{input}}"}]'
providers:
- id: openai:responses:<pinned OpenAI model snapshot>
  label: openai
  config:
    store: false
  prompts:
  - openai
- id: bedrock:<Amazon Nova model id>
  label: bedrock-nova
  config:
    region: <aws-region>
  prompts:
  - bedrock-nova
- id: vertex:<pinned Gemini version>
  label: vertex-gemini
  config:
    projectId: <gcp-project>
    region: <gcp-location>
  prompts:
  - vertex-gemini
- id: anthropic:messages:<pinned Claude model>
  label: claude
  prompts:
  - claude
defaultTest:
  assert:
  - type: is-json
    value:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      required:
      - policy_number
      - claimant_name
      - incident_date
      - claim_amount
      - vehicle_reg
      - incident_type
      properties:
        policy_number:
          type:
          - string
          - 'null'
          pattern: ^MOT-\d{4}-\d{6}$
        claimant_name:
          type:
          - string
          - 'null'
        incident_date:
          type:
          - string
          - 'null'
        claim_amount:
          type:
          - number
          - 'null'
        vehicle_reg:
          type:
          - string
          - 'null'
        incident_type:
          type:
          - string
          - 'null'
          enum:
          - collision
          - theft
          - fire
          - flood
          - null
    metric: schema
  - type: latency
    threshold: 4000
    metric: latency
  - type: cost
    threshold: 0.01
    metric: cost
